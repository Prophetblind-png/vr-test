<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kiri's Room · VR 360</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>#start{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:rgba(255,220,240,.85);font-family:sans-serif}
#start button{font-size:28px;padding:18px 40px;border:0;border-radius:40px;background:#e85aa8;color:#fff;cursor:pointer}</style>
<script>
AFRAME.registerComponent('choice',{schema:{line:{type:'string'},label:{type:'string'}},
 init(){this.el.addEventListener('click',()=>{if(!window.started)return;go(this.data.line)});
  this.el.addEventListener('mouseenter',()=>this.el.setAttribute('scale','1.08 1.08 1'));
  this.el.addEventListener('mouseleave',()=>this.el.setAttribute('scale','1 1 1'));}});
let cur=null;
function play(id){if(cur){cur.pause();cur.currentTime=0}cur=document.getElementById(id);cur.play().catch(()=>{})}
function go(id){document.getElementById('choices').setAttribute('visible',false);
 document.getElementById('caption').setAttribute('value',id==='a2a'?'Stargazing by the window... stay close, okay?':'Pudding and a movie! You pick something cute.');
 play(id);document.getElementById('again').setAttribute('visible',true)}
function start(){window.started=true;document.getElementById('start').style.display='none';play('a1')}
function restart(){document.getElementById('again').setAttribute('visible',false);document.getElementById('choices').setAttribute('visible',true);
 document.getElementById('caption').setAttribute('value','Hi, Miguel! What do you want to do with me today?');play('a1')}
window.addEventListener('DOMContentLoaded',()=>{if(location.search.includes('preview'))document.getElementById('start').style.display='none';const s=document.querySelector('a-scene');
 s.addEventListener('enter-vr',()=>{if(!window.started)start()});
 document.getElementById('again').addEventListener('click',()=>{if(window.started)restart()});});
</script></head><body>
<div id="start"><button onclick="start()">▶ Start (tap) — then press VR goggles</button></div>
<a-scene renderer="colorManagement:true" cursor="rayOrigin:mouse" raycaster="objects:.clickable">
<a-assets><img id="pano" src="assets/pano.jpg"><img id="kiri" src="assets/kiri.png">
<audio id="a1" src="assets/line1.mp3" preload="auto"></audio><audio id="a2a" src="assets/line2a.mp3" preload="auto"></audio><audio id="a2b" src="assets/line2b.mp3" preload="auto"></audio></a-assets>
<a-sky src="#pano" rotation="0 -90 0"></a-sky>
<a-image src="#kiri" position="0 0.8 -1.3" width="0.49" height="1.6" transparent="true" alpha-test="0.5"></a-image>
<a-text id="caption" value="Hi, Miguel! What do you want to do with me today?" position="0 1.75 -1.3" align="center" width="2.2" color="#5a2a6a"></a-text>
<a-entity id="choices">
 <a-entity position="-0.7 1.0 -1.2"><a-plane class="clickable" choice="line:a2a" width="0.7" height="0.2" color="#e85aa8" opacity="0.95"></a-plane><a-text value="Stargaze together" align="center" width="1.6" position="0 0 0.01" color="#fff"></a-text></a-entity>
 <a-entity position="0.7 1.0 -1.2"><a-plane class="clickable" choice="line:a2b" width="0.7" height="0.2" color="#8a5ad8" opacity="0.95"></a-plane><a-text value="Pudding + movie" align="center" width="1.6" position="0 0 0.01" color="#fff"></a-text></a-entity>
</a-entity>
<a-entity id="again" visible="false" position="0.7 1.0 -1.2"><a-plane class="clickable" width="0.5" height="0.16" color="#5ab8d8"></a-plane><a-text value="Start over" align="center" width="1.4" position="0 0 0.01" color="#fff"></a-text></a-entity>
<a-entity camera look-controls position="0 1.6 0"><a-entity cursor="fuse:true;fuseTimeout:1500" raycaster="objects:.clickable" position="0 0 -1" geometry="primitive:ring;radiusInner:0.012;radiusOuter:0.018" material="color:#e85aa8;shader:flat"></a-entity></a-entity>
<a-entity laser-controls="hand:right" raycaster="objects:.clickable"></a-entity>
<a-entity laser-controls="hand:left" raycaster="objects:.clickable"></a-entity>
</a-scene></body></html>
